<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Klapp-Küche">
<meta name="theme-color" content="#4FB2FF">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);height:100%;box-sizing:border-box}body{margin:0}img{max-width:100%}</style>
<title>Klapp-Küche</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap">
<style>
/* Layout: zugeklappt = schwebende Insel (WebGL-Diorama) mit Spiel-HUD; aufgeklappt = Himmel, Station + Picknickdecke/Bach. Look: glänzender Casual-Puzzle-Stil */
:root{
  --navy:#14215B; --blue1:#4FA8FF; --blue2:#2766D9;
  --gold1:#FFE070; --gold2:#F6A91A; --green1:#9BEA52; --green2:#3FAE24;
  --red1:#FF7A5C; --red2:#E0362A; --white:#FFFFFF;
  --sky1:#4FB2FF; --sky2:#A9DBFF; --sky3:#FFDCC4;
  --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --body:"Nunito",ui-rounded,system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--sky1);color:var(--white);font-family:var(--body);font-weight:800;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none;padding:0}
button:focus-visible{outline:3px solid var(--gold1);outline-offset:3px}
.ol{color:var(--white);text-shadow:0 2px 0 var(--navy),2px 0 0 var(--navy),-2px 0 0 var(--navy),0 -2px 0 var(--navy),1.5px 1.5px 0 var(--navy),-1.5px 1.5px 0 var(--navy),1.5px -1.5px 0 var(--navy),-1.5px -1.5px 0 var(--navy),0 5px 0 rgba(0,0,0,.25)}
.sky{background:
  radial-gradient(ellipse 26% 7% at 16% 20%,rgba(255,255,255,.9) 60%,transparent 63%),
  radial-gradient(ellipse 18% 6% at 27% 17%,rgba(255,255,255,.9) 60%,transparent 63%),
  radial-gradient(ellipse 24% 6% at 84% 64%,rgba(255,255,255,.75) 60%,transparent 63%),
  radial-gradient(ellipse 16% 5% at 74% 61%,rgba(255,255,255,.75) 60%,transparent 63%),
  linear-gradient(var(--sky1),var(--sky2) 55%,var(--sky3))}

.gbtn{font-family:var(--display);font-size:1.25rem;letter-spacing:.03em;padding:.5em 1.15em .55em;border-radius:18px;white-space:nowrap;position:relative;isolation:isolate;border:3px solid var(--navy);transition:transform .08s}
.gbtn::after{content:"";position:absolute;left:10%;right:10%;top:4px;height:32%;border-radius:12px;background:rgba(255,255,255,.4);pointer-events:none;z-index:-1}
.gbtn:active{transform:translateY(3px) scale(.97)}
.gbtn.green{background:linear-gradient(var(--green1),var(--green2));box-shadow:inset 0 -5px 0 rgba(0,0,0,.18),0 5px 0 var(--navy),0 8px 14px rgba(0,0,0,.3)}
.gbtn.red{background:linear-gradient(var(--red1),var(--red2));box-shadow:inset 0 -5px 0 rgba(0,0,0,.18),0 5px 0 var(--navy),0 8px 14px rgba(0,0,0,.3)}
.gbtn.gold{background:linear-gradient(var(--gold1),var(--gold2));box-shadow:inset 0 -5px 0 rgba(0,0,0,.15),0 5px 0 var(--navy),0 8px 14px rgba(0,0,0,.3)}
.gbtn.white{background:linear-gradient(#fff,#DCE6F5);color:var(--navy);box-shadow:inset 0 -4px 0 rgba(0,0,0,.1),0 4px 0 var(--navy)}
.gbtn.sm{font-size:1rem;padding:.35em .8em .4em;border-radius:14px}
.pill{display:flex;align-items:center;gap:6px;background:rgba(14,22,70,.6);border:2px solid rgba(255,255,255,.35);border-radius:999px;
  padding:.2em .8em .2em .25em;font-family:var(--display);font-size:1.2rem;font-variant-numeric:tabular-nums;white-space:nowrap;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.pill .ico{width:30px;height:30px;flex:none}
.st{width:1em;height:1em;vertical-align:-.12em}
.st path{fill:#2A3878;stroke:var(--navy);stroke-width:2;stroke-linejoin:round}
.st.on path{fill:url(#gold)}
.panel{background:linear-gradient(var(--blue1),var(--blue2));border:3px solid var(--navy);border-radius:22px;
  box-shadow:inset 0 0 0 3px var(--gold1),inset 0 6px 0 3px rgba(255,255,255,.25),0 6px 0 var(--navy),0 12px 24px rgba(0,0,0,.3)}
@keyframes pop{from{transform:scale(.55);opacity:0}}
.nudge{animation:nudge .5s 2}
@keyframes nudge{50%{transform:scale(1.12) rotate(-3deg)}}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}

/* ---------- ZUGEKLAPPT: Insel ---------- */
#closed{position:relative;height:100%;overflow:hidden}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.hud-top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;gap:8px;
  padding-top:12px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));pointer-events:none}
.hud-top>*{pointer-events:auto}
.logo{font-family:var(--display);font-weight:400;font-size:1.9rem;line-height:.9;margin:0;transform:rotate(-3deg)}
.hud-r{display:flex;gap:8px;align-items:center}
.mapbtn{display:flex;align-items:center;gap:6px;font-family:var(--display);font-size:1.05rem;padding:.3em .75em .35em}
.mapbtn svg{width:20px;height:20px}
.messchip{position:absolute;top:80px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;max-width:calc(100% - 28px);
  background:linear-gradient(var(--red1),var(--red2));border:3px solid var(--navy);border-radius:999px;box-shadow:0 4px 0 var(--navy);
  padding:.3em .9em .3em .3em;font-size:.88rem;animation:wobble 2.4s ease-in-out infinite}
.messchip i{font-style:normal;width:26px;height:26px;flex:none;border-radius:50%;background:linear-gradient(var(--gold1),var(--gold2));color:var(--navy);border:2px solid var(--navy);display:grid;place-items:center;font-family:var(--display)}
.messchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@keyframes wobble{0%,78%,100%{transform:translateX(-50%) rotate(0)}84%{transform:translateX(-50%) rotate(-4deg) scale(1.05)}90%{transform:translateX(-50%) rotate(4deg) scale(1.05)}96%{transform:translateX(-50%) rotate(-2deg)}}
.arrow{position:absolute;top:44%;width:48px;height:48px;border-radius:50%;z-index:5;display:grid;place-items:center;
  background:linear-gradient(#fff,#D3DEF0);border:3px solid var(--navy);box-shadow:0 4px 0 var(--navy),0 6px 12px rgba(0,0,0,.2)}
.arrow svg{width:22px;height:22px}
.arrow:active{transform:translateY(3px)}
.arrow.l{left:max(10px,env(safe-area-inset-left,0px))}.arrow.r{right:max(10px,env(safe-area-inset-right,0px))}
.hud-bottom{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;gap:6px;
  padding-bottom:14px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));pointer-events:none}
.hud-bottom>*{pointer-events:auto}
.focus{width:min(430px,100%);padding:12px 12px 12px 16px;display:flex;align-items:center;gap:12px}
.focus.bounce{animation:pop .45s cubic-bezier(.3,1.7,.5,1)}
.focus .txt{flex:1;min-width:0}
.focus .lvl{font-family:var(--display);font-size:.85rem;color:var(--gold1);letter-spacing:.05em}
.focus h2{font-family:var(--display);font-weight:400;font-size:1.4rem;margin:0;line-height:1.05;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.focus h2 .fst{font-size:1rem;display:inline-flex;gap:1px}
.focus p{margin:3px 0 0;font-size:.85rem;color:#E4F0FF;font-variant-numeric:tabular-nums}
.focus p b{color:var(--gold1)}
.focus.mess{background:linear-gradient(#FF9A6B,#E8452F)}
.focus.mess p{color:#FFF0E8}
.focus.idle{background:linear-gradient(rgba(79,168,255,.9),rgba(39,102,217,.9))}
.focus.locked{background:linear-gradient(#8C97B5,#5E6A8C)}
.foldhint{display:flex;align-items:center;gap:8px;font-size:.8rem;line-height:1.1;max-width:7em}
.foldicon{width:40px;height:30px;position:relative;perspective:120px;flex:none}
.foldicon i{position:absolute;top:0;width:20px;height:30px;border:3px solid var(--navy);border-radius:5px;background:var(--white)}
.foldicon i:first-child{left:0}
.foldicon i:last-child{left:18px;transform-origin:left center;animation:flap 1.8s ease-in-out infinite;background:var(--gold1)}
@keyframes flap{0%,20%{transform:rotateY(-170deg)}55%,85%{transform:rotateY(0)}100%{transform:rotateY(-170deg)}}
.devlink{font-size:.72rem;color:var(--white);background:rgba(14,22,70,.5);border-radius:999px;padding:.25em .8em}

/* ---------- Sheets ---------- */
.sheet{position:fixed;inset:0;background:rgba(8,14,50,.55);display:grid;place-items:center;z-index:50;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:30px 20px}
.card{width:min(360px,100%);padding:44px 20px 22px;text-align:center;display:flex;flex-direction:column;gap:10px;position:relative;animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
.ribbon{position:absolute;left:50%;top:-22px;transform:translateX(-50%);background:linear-gradient(var(--gold1),var(--gold2));border:3px solid var(--navy);
  border-radius:14px;padding:.25em 1.2em;font-family:var(--display);font-size:1.5rem;white-space:nowrap;box-shadow:0 5px 0 var(--navy)}
.rstars{display:flex;justify-content:center;align-items:flex-end;gap:4px;font-size:3.4rem;height:1.1em}
.rstars .st:nth-child(2){font-size:1.25em;transform:translateY(-6px)}
.rstars .st.on{animation:starin .45s cubic-bezier(.3,1.8,.5,1) backwards}
@keyframes starin{from{transform:scale(0) rotate(-90deg)}}
.big{font-family:var(--display);font-size:3.2rem;line-height:1;font-variant-numeric:tabular-nums}
.rows{display:grid;grid-template-columns:1fr auto;gap:5px 12px;text-align:left;font-size:.95rem;font-variant-numeric:tabular-nums;background:rgba(14,22,70,.35);border-radius:14px;padding:10px 12px}
.rows span:nth-child(even){text-align:right;color:var(--gold1)}
.badge{align-self:center;background:linear-gradient(var(--red1),var(--red2));border:3px solid var(--navy);border-radius:999px;padding:.15em .9em;font-family:var(--display);font-size:1.1rem;transform:rotate(-4deg);animation:nudge .6s .8s 3}
.lvcard{width:min(380px,100%);max-height:100%}
.lvlist{display:flex;flex-direction:column;gap:6px;overflow:auto;max-height:58vh;padding:4px 6px 10px;text-align:left}
.node{display:flex;align-items:center;gap:12px;width:100%;padding:4px;border-radius:16px}
.node:nth-child(4n+2),.node:nth-child(4n+4){padding-left:28px}
.node:nth-child(4n+3){padding-left:56px}
.node .ball{width:56px;height:56px;flex:none;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:1.5rem;border:3px solid var(--navy);
  background:linear-gradient(var(--green1),var(--green2));box-shadow:inset 0 -5px 0 rgba(0,0,0,.18),inset 0 5px 0 rgba(255,255,255,.35),0 4px 0 var(--navy);position:relative}
.node.cur .ball{background:linear-gradient(var(--gold1),var(--gold2));animation:nudge 1.2s infinite}
.node.locked .ball{background:linear-gradient(#A3ACC6,#6D789A)}
.node.boss .ball{background:linear-gradient(#FF9A6B,#E8452F)}
.node .info{min-width:0}
.node .info b{display:block;font-family:var(--display);font-weight:400;font-size:1.1rem}
.node .info small{font-size:.78rem;color:#E4F0FF}
.node .info .fst{font-size:.95rem}

/* ---------- Wischen ---------- */
#wipe{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;gap:12px;
  padding-block:12px 18px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
.wbox{position:relative;flex:1;min-height:0;border:4px solid var(--navy);border-radius:34px 28px 38px 30px;overflow:hidden;touch-action:none;
  box-shadow:inset 0 0 0 4px var(--gold1),0 6px 0 var(--navy),0 14px 28px rgba(0,0,0,.3)}
.wbox.grass{background:radial-gradient(circle at 20% 30%,#9BE36A 0 3px,transparent 4px) 0 0/38px 38px,radial-gradient(circle at 70% 70%,#62B843 0 3px,transparent 4px) 0 0/30px 30px,linear-gradient(#86D45A,#6CC24A)}
.wbox.blanket{background-color:#FFF8F0;background-image:linear-gradient(90deg,rgba(234,72,72,.5) 50%,transparent 50%),linear-gradient(rgba(234,72,72,.5) 50%,transparent 50%);background-size:56px 56px}
.wbox.stone{background:radial-gradient(circle at 30% 40%,rgba(255,255,255,.18) 0 18%,transparent 20%) 0 0/120px 110px,radial-gradient(circle at 70% 75%,rgba(0,0,0,.08) 0 14%,transparent 16%) 0 0/90px 100px,linear-gradient(#B4BDCB,#949FB2)}
#wc{position:absolute;inset:0;width:100%;height:100%}
.sponge{position:absolute;width:84px;height:56px;margin:-28px 0 0 -42px;border:3px solid var(--navy);border-radius:14px;pointer-events:none;
  background:linear-gradient(#7EE0B5 0 38%,var(--gold1) 38%);box-shadow:inset 0 -6px 0 rgba(0,0,0,.12),0 8px 14px rgba(0,0,0,.35);transform:rotate(-12deg)}
.whint{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);font-family:var(--display);font-size:1.2rem;white-space:nowrap;pointer-events:none;animation:nudge 1s infinite}

/* ---------- AUFGEKLAPPT ---------- */
#open{position:relative;overflow:hidden;height:100%;display:flex;flex-direction:column;gap:10px;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:10px 14px}
#open.shake .field{animation:shake .3s}
.bar{display:flex;align-items:center;gap:8px}
.bar h2{font-family:var(--display);font-weight:400;font-size:1.3rem;margin:0;white-space:nowrap;line-height:1}
.bar h2 small{display:block;font-size:.7em;color:var(--gold1)}
.timer{flex:1;height:22px;min-width:60px;border-radius:999px;background:rgba(14,22,70,.55);border:3px solid var(--navy);overflow:hidden;position:relative}
.timer i{display:block;height:100%;width:100%;transform-origin:left;background:linear-gradient(var(--green1),var(--green2));border-radius:999px}
.timer::after{content:"";position:absolute;left:6px;right:6px;top:3px;height:4px;border-radius:4px;background:rgba(255,255,255,.45)}
.timer.low i{background:linear-gradient(var(--red1),var(--red2))}
.timer.low{animation:nudge .5s infinite}
@media (max-width:560px){#open .bar{flex-wrap:wrap;row-gap:8px}#open .bar h2{flex:1}#open .timer{order:5;flex-basis:100%}}
.combo{font-family:var(--display);font-size:.9rem;background:linear-gradient(var(--gold1),var(--gold2));color:var(--navy);border:2px solid var(--navy);border-radius:999px;padding:.1em .6em;white-space:nowrap}
.score.bump .num{display:inline-block;animation:nudge .25s}
.field{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px}
@media (min-aspect-ratio:1/1){.field{flex-direction:row}.machine-wrap{flex:1.5}.counter{flex:1}}
.machine-wrap{position:relative;flex:1.5;min-height:0;perspective:1100px}
.machine{position:absolute;inset:0;display:grid;gap:9px;padding:14px 12px 12px;border:4px solid var(--navy);border-radius:42px 34px 38px 46px;box-shadow:0 6px 0 var(--navy),0 14px 28px rgba(0,0,0,.3)}
.zone{position:relative;border:3px solid var(--navy);border-radius:22px 18px 24px 16px;padding:24px 5px 5px;min-height:0;
  box-shadow:inset 0 6px 12px rgba(0,0,0,.28);transition:transform .15s,box-shadow .15s}
.zone label{position:absolute;top:4px;left:8px;font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;background:var(--navy);border-radius:999px;padding:.05em .6em;pointer-events:none;z-index:2;white-space:nowrap}
.zone .grid{position:absolute;left:5px;right:5px;top:24px;bottom:5px;border-radius:12px;
  background-image:linear-gradient(to right,rgba(255,255,255,.22) 1.5px,transparent 1.5px),linear-gradient(to bottom,rgba(255,255,255,.22) 1.5px,transparent 1.5px);
  background-size:calc(100% / var(--c)) calc(100% / var(--r))}
.zone.hot{transform:scale(1.03);box-shadow:inset 0 5px 12px rgba(0,0,0,.2),0 0 0 4px var(--gold1),0 0 22px 6px rgba(255,224,112,.8)}
.zone.bad{animation:shake .35s;box-shadow:inset 0 0 0 4px var(--red2)}
.zone.in{animation:slidein .5s cubic-bezier(.3,1.5,.5,1) backwards}
@keyframes slidein{from{transform:translateY(46px) scale(.9);opacity:0}}
.preview{position:absolute;border-radius:10px;border:3px dashed #fff;background:rgba(155,234,82,.45);pointer-events:none;z-index:1}
.preview.bad{background:rgba(255,90,70,.45)}

.counter{position:relative;flex:1;min-height:0;border:4px solid var(--navy);border-radius:30px 38px 28px 34px;box-shadow:0 6px 0 var(--navy),0 14px 28px rgba(0,0,0,.3);
  background-color:#FFF8F0;background-image:linear-gradient(90deg,rgba(234,72,72,.45) 50%,transparent 50%),linear-gradient(rgba(234,72,72,.45) 50%,transparent 50%);background-size:44px 44px;
  padding:36px 10px 10px;display:flex;flex-wrap:wrap;align-content:flex-start;justify-content:center;gap:4px;overflow:hidden}
.counter::after{content:"";position:absolute;inset:7px;border:2px dashed rgba(180,40,40,.55);border-radius:24px;pointer-events:none}
.counter::before{content:attr(data-label);position:absolute;top:8px;left:14px;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;background:var(--navy);border-radius:999px;padding:.1em .7em;z-index:2}
.counter.stream{background:linear-gradient(rgba(255,255,255,.35),transparent 18%,transparent 82%,rgba(255,255,255,.35)),repeating-linear-gradient(100deg,#5BC0F2 0 34px,#4AAFE6 34px 68px);background-size:auto,200px 100%;animation:flow 1.6s linear infinite;padding:0}
.counter.stream::after{border-color:rgba(255,255,255,.7)}
@keyframes flow{to{background-position:0 0,-200px 0}}
.item{width:62px;height:62px;display:grid;place-items:center;font-size:42px;line-height:1;touch-action:none;cursor:grab;position:relative;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.75) 0 42%,transparent 68%);filter:drop-shadow(0 5px 0 rgba(60,25,0,.28));animation:popin .4s cubic-bezier(.3,1.7,.5,1) backwards}
@keyframes popin{from{transform:scale(0)}}
.item .g{display:grid;place-items:center;line-height:1;pointer-events:none}
.item svg{width:1em;height:1em}
.item.shape{width:calc(var(--w) * 36px);height:calc(var(--h) * 36px);font-size:calc(min(var(--w),var(--h)) * 28px);border-radius:12px;
  background:rgba(255,255,255,.8);box-shadow:inset 0 0 0 2px rgba(20,33,91,.35)}
.stream .item{position:absolute;left:0;top:0;animation:none}
.item.dirty::after{content:"";position:absolute;inset:12%;border-radius:50%;pointer-events:none;opacity:var(--d,1);
  background:radial-gradient(circle at 28% 32%,rgba(110,62,20,.85) 0 13%,transparent 14%),radial-gradient(circle at 70% 64%,rgba(110,62,20,.8) 0 16%,transparent 17%),radial-gradient(circle at 60% 24%,rgba(110,62,20,.7) 0 9%,transparent 10%),radial-gradient(circle at 35% 72%,rgba(110,62,20,.6) 0 8%,transparent 9%)}
.item.rub{animation:rub .15s infinite}
@keyframes rub{50%{transform:rotate(6deg) scale(1.05)}}
.item.melt::before{content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none;
  background:conic-gradient(#3B9BFF calc(var(--m,1) * 1turn),rgba(255,255,255,.25) 0);
  -webkit-mask:radial-gradient(circle,transparent 60%,#000 62%);mask:radial-gradient(circle,transparent 60%,#000 62%)}
.item.melt.warn::before{background:conic-gradient(#FF4B3E calc(var(--m,1) * 1turn),rgba(255,255,255,.25) 0)}
.item.melt.warn .g{animation:nudge .4s infinite}
.item.ghost{visibility:hidden}
.item.placed{position:absolute;width:auto;height:auto;cursor:default;background:none;border-radius:8px;filter:drop-shadow(0 3px 0 rgba(0,0,0,.25));animation:land .35s cubic-bezier(.3,1.8,.5,1)}
.item.placed.shape{background:rgba(255,255,255,.22);box-shadow:none}
@keyframes land{from{transform:scale(1.6)}}
.drag{position:fixed;z-index:60;pointer-events:none;transform:scale(1.2) rotate(-8deg)!important;filter:drop-shadow(0 14px 6px rgba(0,0,0,.3));animation:none!important}
.thief{position:absolute;left:0;top:0;z-index:30;font-size:44px;line-height:1;padding:10px;margin:-32px 0 0 -32px;cursor:pointer;touch-action:none;filter:drop-shadow(0 4px 0 rgba(0,0,0,.25))}
.thief .carry{position:absolute;right:-6px;top:4px;font-size:24px}
.thief .carry svg{width:1em;height:1em}

/* Stationen innen */
.g-spueler .machine{background:radial-gradient(circle at 25% 15%,rgba(255,255,255,.25) 0 20%,transparent 40%),linear-gradient(160deg,#B8C2D3,#7C889F);box-shadow:inset 0 14px 0 #7CCB4E,inset 0 18px 0 rgba(0,0,0,.12),0 6px 0 var(--navy),0 14px 28px rgba(0,0,0,.3);padding-top:24px;
  grid-template-columns:2fr 1fr;grid-template-rows:1fr 1.4fr;grid-template-areas:"oben oben" "unten korb"}
.g-spueler .zone{background:repeating-linear-gradient(90deg,transparent 0 22px,rgba(200,140,80,.55) 22px 27px),linear-gradient(#5A6680,#424D66)}
.g-kuehl .machine{background:repeating-linear-gradient(95deg,#B5774A 0 16px,#A66A3F 16px 24px,#BA7F52 24px 40px);grid-template-columns:3fr 1.3fr;grid-template-rows:1fr 1fr 1fr;grid-template-areas:"gefrier tuer" "kuehl tuer" "gemuese tuer"}
.g-kuehl .z-gefrier{background:radial-gradient(circle,#fff 0 2px,transparent 3px) 0 0/22px 22px,linear-gradient(#E6F7FF,#A9DCFF)}
.g-kuehl .z-kuehl{background:linear-gradient(#FFF6E6,#EED8B4)}
.g-kuehl .z-gemuese{background:linear-gradient(#DDF8C6,#9FD877)}
.g-kuehl .z-tuer{background:radial-gradient(ellipse at 50% 40%,#7A4A2A,#4E2C17);border-radius:40px}
.g-lade .machine{background:repeating-linear-gradient(0deg,#E0A465 0 34px,#C9884A 34px 38px);grid-template-columns:repeat(4,1fr)}
@media (max-aspect-ratio:1/1){.g-lade .machine{grid-template-columns:repeat(2,1fr)}}
.g-lade .zone{background:linear-gradient(#3E8A62,#2B6A4A)}
.door{position:absolute;inset:0;border:4px solid var(--navy);border-radius:42px 34px 38px 46px;z-index:10;display:grid;place-items:center;pointer-events:none}
.g-spueler .door{background:linear-gradient(#B9E6FF,#5EB6F0);animation:curtain .8s .3s cubic-bezier(.5,0,.7,.4) forwards}
.g-spueler .door::after{content:"";position:absolute;inset:0;border-radius:inherit;background:repeating-linear-gradient(90deg,rgba(255,255,255,.35) 0 6px,transparent 6px 22px)}
@keyframes curtain{to{transform:translateY(-105%);opacity:0}}
.g-kuehl .door{background:none;border:none;display:block}
.g-kuehl .door i{position:absolute;top:0;bottom:0;width:50%;background:radial-gradient(circle at 50% 50%,#E6F7FF 0 30%,#BFE6FF 31% 38%,#8A5634 39%);border:4px solid var(--navy)}
.g-kuehl .door i:first-child{left:0;border-radius:46px 0 0 46px;transform-origin:0 50%;animation:dl .8s .3s ease-in forwards}
.g-kuehl .door i:last-child{right:0;border-radius:0 46px 46px 0;transform-origin:100% 50%;animation:dr .8s .3s ease-in forwards}
@keyframes dl{to{transform:rotateY(-105deg);opacity:0}}
@keyframes dr{to{transform:rotateY(105deg);opacity:0}}
.g-lade .door{background:linear-gradient(#F2B675,#D18A4E);animation:drawer .7s .3s cubic-bezier(.6,0,.8,.5) forwards}
.g-lade .door::after{content:"";width:80px;height:18px;background:linear-gradient(var(--gold1),var(--gold2));border:3px solid var(--navy);border-radius:9px}
@keyframes drawer{to{transform:translateY(105%);opacity:0}}

.tut{position:absolute;inset:0;z-index:40;display:grid;place-items:center;background:rgba(8,14,50,.45);padding:20px}
.tut .panel{width:min(330px,100%);padding:20px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center;animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
.tut .ico{font-size:3.4rem;line-height:1;filter:drop-shadow(0 5px 0 rgba(0,0,0,.25));animation:nudge 1s infinite}
.tut h3{font-family:var(--display);font-weight:400;font-size:1.6rem;margin:0}
.tut p{margin:0 0 6px;font-size:.95rem;color:#E9F3FF;line-height:1.35}
.flash{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:70}
.flash b{font-family:var(--display);font-weight:400;font-size:clamp(3rem,13vw,6rem);animation:zoom .9s ease-out forwards;color:var(--gold1)}
@keyframes zoom{from{transform:scale(.3) rotate(-8deg);opacity:0}25%{transform:scale(1.15) rotate(2deg);opacity:1}70%{transform:scale(1);opacity:1}to{transform:scale(1.05);opacity:0}}
.banner{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:45;padding:12px 18px;display:flex;align-items:center;gap:14px;width:max-content;max-width:calc(100% - 28px);animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
.banner p{margin:0;font-size:.95rem}
.banner strong{font-family:var(--display);font-weight:400;font-size:1.35rem;display:block}
.pop{position:fixed;z-index:75;pointer-events:none;font-family:var(--display);font-size:1.8rem;color:var(--gold1);animation:up .9s ease-out forwards;transform:translate(-50%,-50%);white-space:nowrap}
.pop.neg{color:#FF8A7A}
.pop.say{color:var(--white);font-size:1.4rem}
@keyframes up{0%{transform:translate(-50%,-50%) scale(.4)}20%{transform:translate(-50%,-70%) scale(1.15)}to{transform:translate(-50%,-170%) scale(1);opacity:0}}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:85}

/* Klapp-Simulation */
#fold{position:fixed;inset:0;z-index:90;background:rgba(8,14,50,0)}
#fold .dev{position:absolute;left:50%;top:50%;perspective:1400px;transform-style:preserve-3d}
#fold .pl,#fold .pr{position:absolute;top:0;width:100%;height:100%;border:6px solid #0A0F2E;overflow:hidden;background:#0A0F2E}
#fold .pl{left:0;border-radius:28px 6px 6px 28px}
#fold .pr{left:100%;transform-origin:left center;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:6px 28px 28px 6px}
#fold .face{position:absolute;inset:0;background-size:cover;background-position:center}
#fold .face.game{display:grid;place-items:center;align-content:center;gap:6px;text-align:center}
#fold .face.game b{font-family:var(--display);font-weight:400;font-size:1.4rem}
#fold .face.game span{font-size:3.2rem;filter:drop-shadow(0 5px 0 rgba(0,0,0,.25))}
#fold .hinge{position:absolute;top:0;bottom:0;left:100%;width:14px;margin-left:-7px;z-index:3;background:linear-gradient(90deg,transparent,rgba(0,0,0,.35),transparent);pointer-events:none}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}
</style>

<script>
(()=>{
/* ===== Klapp-Simulation =====
   true  = Auf- und Zuklappen per Button mit Animation (zum Testen auf iPhone ohne Fold)
   false = nur echtes Aufklappen am Fold (für die App-Store-Version) */
const FOLD_SIM=true;

const $=s=>document.querySelector(s);
const fmt=n=>Math.round(n).toLocaleString('de-AT');
const rnd=n=>Math.random()*n|0;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const STARPATH='<path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z"/>';
const starSVG=(on,delay)=>`<svg class="st${on?' on':''}" viewBox="0 0 24 24"${delay!=null?` style="animation-delay:${delay}s"`:''}>${STARPATH}</svg>`;
const starRow=n=>[0,1,2].map(i=>starSVG(i<n)).join('');

/* ===== Sound ===== */
let ac=null;
function sfx(type,lvl=0){
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==='suspended')ac.resume();
    const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();
    o.connect(g);g.connect(ac.destination);
    const env=(v,d)=>{g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+0.015);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.start(t);o.stop(t+d+0.02)};
    if(type==='pop'){o.type='sine';const f=520*Math.pow(1.06,Math.min(lvl,10));o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*2,t+0.1);env(0.18,0.16)}
    else if(type==='bad'){o.type='square';o.frequency.setValueAtTime(220,t);o.frequency.exponentialRampToValueAtTime(110,t+0.2);env(0.06,0.22)}
    else if(type==='squeak'){o.type='sine';o.frequency.setValueAtTime(1900,t);o.frequency.exponentialRampToValueAtTime(2700,t+0.07);env(0.08,0.12)}
    else if(type==='hinge'){o.type='triangle';o.frequency.setValueAtTime(180,t);o.frequency.exponentialRampToValueAtTime(700,t+0.3);env(0.1,0.35)}
    else if(type==='ding'){o.type='sine';o.frequency.setValueAtTime(880*(1+lvl*0.26),t);env(0.14,0.4)}
    else if(type==='win'){[0,0.1,0.2].forEach((d,i)=>{const o2=ac.createOscillator(),g2=ac.createGain();o2.type='triangle';o2.frequency.value=[523,659,784][i];o2.connect(g2);g2.connect(ac.destination);g2.gain.setValueAtTime(0.0001,t+d);g2.gain.exponentialRampToValueAtTime(0.12,t+d+0.02);g2.gain.exponentialRampToValueAtTime(0.0001,t+d+0.35);o2.start(t+d);o2.stop(t+d+0.4)});o.disconnect()}
  }catch(e){}
}

/* ===== Partikel ===== */
const fx=$('#fx'),fctx=fx.getContext('2d');let parts=[],fxOn=false,fxLast=0;
function sizeFx(){const d=Math.min(devicePixelRatio||1,2);fx.width=innerWidth*d;fx.height=innerHeight*d;fctx.setTransform(d,0,0,d,0,0)}
sizeFx();addEventListener('resize',sizeFx);
const COLS=['#FFE070','#FFFFFF','#9BEA52','#FF7A9C','#4FA8FF'];
function fxStart(){if(!fxOn){fxOn=true;fxLast=performance.now();requestAnimationFrame(fxLoop)}}
function burst(x,y,n=14,kind='star'){
  if(reduce)return;
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,sp=kind==='bubble'?20+Math.random()*50:150+Math.random()*260;
    parts.push({x,y,vx:Math.cos(a)*sp,vy:kind==='bubble'?-40-Math.random()*60:Math.sin(a)*sp-180,life:0,max:kind==='bubble'?0.9+Math.random()*0.6:0.6+Math.random()*0.5,
      s:kind==='bubble'?5+Math.random()*12:6+Math.random()*9,r:Math.random()*6,vr:(Math.random()-.5)*12,c:COLS[rnd(COLS.length)],kind})}
  fxStart();
}
function confetti(){if(reduce)return;for(let i=0;i<90;i++)parts.push({x:Math.random()*innerWidth,y:-20-Math.random()*200,vx:(Math.random()-.5)*120,vy:80+Math.random()*160,life:0,max:2.6,s:7+Math.random()*7,r:Math.random()*6,vr:(Math.random()-.5)*10,c:COLS[rnd(COLS.length)],kind:'conf'});fxStart()}
function starPath(c,r){c.beginPath();for(let i=0;i<10;i++){const a=i*Math.PI/5-Math.PI/2,rr=i%2?r*0.45:r;c.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}c.closePath()}
function fxLoop(now){
  const dt=Math.min(0.05,(now-fxLast)/1000);fxLast=now;
  fctx.clearRect(0,0,innerWidth,innerHeight);
  parts=parts.filter(p=>(p.life+=dt)<p.max);
  for(const p of parts){
    if(p.kind==='bubble'){p.vx*=0.98;p.x+=p.vx*dt+Math.sin(p.life*6)*0.4;p.y+=p.vy*dt}
    else{p.vy+=(p.kind==='conf'?120:700)*dt;p.x+=p.vx*dt;p.y+=p.vy*dt}
    p.r+=p.vr*dt;const a=1-p.life/p.max;
    fctx.save();fctx.translate(p.x,p.y);fctx.rotate(p.r);fctx.globalAlpha=Math.min(1,a*1.6);
    if(p.kind==='star'){starPath(fctx,p.s);fctx.fillStyle=p.c;fctx.fill();fctx.lineWidth=2;fctx.strokeStyle='#14215B';fctx.stroke()}
    else if(p.kind==='conf'){fctx.fillStyle=p.c;fctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2)}
    else{fctx.beginPath();fctx.arc(0,0,p.s,0,7);fctx.fillStyle='rgba(255,255,255,.25)';fctx.fill();fctx.lineWidth=2;fctx.strokeStyle='rgba(255,255,255,.9)';fctx.stroke();
      fctx.beginPath();fctx.arc(-p.s*.35,-p.s*.35,p.s*.25,0,7);fctx.fillStyle='#fff';fctx.fill()}
    fctx.restore();
  }
  if(parts.length)requestAnimationFrame(fxLoop);else{fxOn=false;fctx.clearRect(0,0,innerWidth,innerHeight)}
}

/* ===== Spieldaten ===== */
const FORK='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 2v7c0 1.3.8 2.4 2 2.8V22h3V11.8c1.2-.4 2-1.5 2-2.8V2h-1.6v6h-.9V2h-1.6v6H10V2z" fill="#DCE4F0" stroke="#14215B" stroke-width="1.4" stroke-linejoin="round"/></svg>';
// s = Platzbedarf [Breite, Höhe] in Feldern (nur in Platz-Levels)
const TYPES={
  teller:{g:'🍽️',n:'Teller',s:[1,2]}, schuessel:{g:'🥣',n:'Schüssel',s:[2,1]}, pfanne:{g:'🍳',n:'Pfanne',s:[2,2]},
  tasse:{g:'☕',n:'Tasse',s:[1,1]}, glas:{g:'🍷',n:'Glas',s:[1,2]},
  loeffel:{g:'🥄',n:'Löffel',s:[1,2]}, messer:{g:'🔪',n:'Messer',s:[1,2]}, gabel:{g:FORK,n:'Gabel',s:[1,2]}, staebchen:{g:'🥢',n:'Stäbchen',s:[1,2]},
  eis:{g:'🍦',n:'Eis',s:[1,1]}, wuerfel:{g:'🧊',n:'Eiswürfel',s:[1,1]}, becher:{g:'🍨',n:'Eisbecher',s:[1,1]},
  karotte:{g:'🥕',n:'Karotte',s:[2,1]}, brokkoli:{g:'🥦',n:'Brokkoli',s:[1,1]}, gurke:{g:'🥒',n:'Gurke',s:[2,1]}, paprika:{g:'🫑',n:'Paprika',s:[1,1]},
  kaese:{g:'🧀',n:'Käse',s:[1,1]}, ei:{g:'🥚',n:'Eier',s:[1,1]}, butter:{g:'🧈',n:'Butter',s:[1,1]}, huhn:{g:'🍗',n:'Hendl',s:[2,1]},
  milch:{g:'🥛',n:'Milch',s:[1,2]}, saft:{g:'🧃',n:'Saft',s:[1,2]}, bier:{g:'🍺',n:'Bier',s:[1,1]}
};
const FROZEN=['eis','wuerfel','becher'];
// c/r = Raster normal, tc/tr = Raster in Platz-Levels
const ST={
  spueler:{id:'spueler',name:'Spülfelsen',ico:'🍽️',
    zones:[{id:'oben',label:'Gläserregal',accept:['tasse','glas'],c:6,r:2,tc:5,tr:2},
           {id:'unten',label:'Tellerregal',accept:['teller','schuessel','pfanne'],c:4,r:3,tc:4,tr:3},
           {id:'korb',label:'Besteckkorb',accept:['loeffel','messer','gabel'],c:2,r:3,tc:3,tr:2}]},
  kuehl:{id:'kuehl',name:'Baumkühlschrank',ico:'🌳',
    zones:[{id:'gefrier',label:'Eisfach',accept:['eis','wuerfel','becher'],c:4,r:2,tc:4,tr:2},
           {id:'kuehl',label:'Vorrat',accept:['kaese','ei','butter','huhn'],c:4,r:2,tc:4,tr:2},
           {id:'gemuese',label:'Gemüse',accept:['karotte','brokkoli','gurke','paprika'],c:4,r:2,tc:4,tr:2},
           {id:'tuer',label:'Astloch',accept:['milch','saft','bier'],c:2,r:4,tc:2,tr:4}]},
  lade:{id:'lade',name:'Besteckkiste',ico:'🥄',
    zones:[{id:'messer',label:'Messer',accept:['messer'],c:2,r:3,tc:2,tr:4},
           {id:'gabel',label:'Gabeln',accept:['gabel'],c:2,r:3,tc:2,tr:4},
           {id:'loeffel',label:'Löffel',accept:['loeffel'],c:2,r:3,tc:2,tr:4},
           {id:'staebchen',label:'Stäbchen',accept:['staebchen'],c:2,r:3,tc:2,tr:4}]}
};
const LEVELS=[
  {st:'spueler',time:30,count:8},
  {st:'kuehl',time:30,count:10},
  {st:'lade',time:25,count:12,jumble:true},
  {st:'spueler',time:38,count:10,scrub:0.7,neu:'scrub'},
  {st:'kuehl',time:35,count:12,melt:9,neu:'melt'},
  {st:'lade',time:34,count:14,jumble:true,thief:5.5,neu:'thief'},
  {st:'spueler',time:42,count:14,stream:true,neu:'stream'},

  const pick=cand[0]||list.sort((a,b)=>dir>0?a.d-b.d:b.d-a.d)[0];vel=0;targetYaw=yaw+((pick.d>0)===(dir>0)?pick.d:pick.d+dir*Math.PI*2)}

// Loop
let last=performance.now(),tAll=0;
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  if(view!=='closed'||document.hidden)return;
  tAll+=dt;const t=tAll;
  if(!dragging){
    if(targetYaw!=null){const d=targetYaw-yaw;yaw+=d*Math.min(1,dt*5);if(Math.abs(d)<0.003){yaw=targetYaw;targetYaw=null}}
    else if(Math.abs(vel)>0.05){yaw+=vel*dt;vel*=Math.pow(0.03,dt);if(Math.abs(vel)<=0.25){vel=0;snap()}}
  }
  isl.rotation.y=yaw;isl.position.y=Math.sin(t*0.8)*0.06;
  let nf=null,bd=0.32;pois().forEach(p=>{const d=Math.abs(angDiff(p.yaw,yaw));if(d<bd){bd=d;nf=p}});
  if(nf!==focused)setFocus(nf);
  focusT+=dt;
  stations.forEach((s,i)=>{const on=s===focused,g=s.mk,ph=on?(focusT%2.6)/0.9:1;
    s.wig(on&&ph<1?Math.sin(ph*Math.PI):0);
    const sc=on?1.6:(s.cur?1.2:0.85);g.scale.setScalar(g.scale.x+(sc-g.scale.x)*Math.min(1,dt*8));
    g.rotation.y+=dt*(on?4:1.2);g.position.y=g.userData.base+(on||s.cur?Math.abs(Math.sin(t*5))*0.12:Math.sin(t*2+i)*0.03);
    g.userData.mat.emissiveIntensity=on?0.45+0.3*Math.sin(t*8):0.15});
  if(mess){const g=mess.mk,on=focused===mess;g.rotation.y+=dt*3;g.position.y=g.userData.base+Math.abs(Math.sin(t*(on?6:3)))*0.1;g.scale.setScalar(on?1.5:1.1);g.userData.mat.emissiveIntensity=0.35+0.3*Math.sin(t*8)}
  waterT.offset.y-=dt*0.8;waterT2.offset.y+=dt*1.3;
  splash.forEach((m,i)=>{const p=(t*1.6+i/4)%1;m.position.set(Math.sin(i*1.7)*0.12*p,0.68+Math.sin(p*Math.PI)*0.12,-0.12+Math.cos(i*1.7)*0.1*p);m.scale.setScalar(1-p*0.6)});
  mist.forEach((m,i)=>{const p=(t*0.4+i/5)%1;m.position.set(0.58+Math.sin(i*2.3)*0.4*p,-3.5-p*0.3,1.05+Math.cos(i*2.3)*0.3*p);m.scale.setScalar(0.6+p*1.4);m.material.opacity=0.5*(1-p)});
  flames.forEach((f,i)=>{const s=0.85+Math.sin(t*(11+i*3))*0.12+Math.sin(t*23+i)*0.06;f.scale.set(1,s,1);f.position.y=0.1+f.userData.h*s/2});
  fireL.intensity=0.8+Math.sin(t*13)*0.15+Math.sin(t*29)*0.08;
  smoke.forEach((m,i)=>{const p=(t*0.35+i/3)%1;m.position.set(Math.sin(t+i)*0.08,0.45+p*0.9,0);m.scale.setScalar(0.6+p*1.6);m.material.opacity=0.55*(1-p)});
  minis.forEach(g=>{g.position.y=g.userData.y+Math.sin(t*0.9+g.userData.ph)*0.15});
  orbit.rotation.y=t*0.05;cloudRing.rotation.y=-t*0.03;
  birds.forEach(b=>{const a=t*b.sp+b.ph;b.g.position.set(Math.sin(a)*b.r,b.y+Math.sin(t*1.3+b.ph)*0.2,Math.cos(a)*b.r);b.g.rotation.y=a+Math.PI/2;const f=Math.sin(t*12+b.ph)*0.7;b.wl.rotation.z=f;b.wr.rotation.z=-f});

}

    const r=wc.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);wc.width=r.width*dpr;wc.height=r.height*dpr;
    const W=wc.width,H=wc.height,cx=W/2,cy=H/2,Rr=Math.min(W,H)*0.34,seed=day.seed;
    wx.globalCompositeOperation='source-over';wx.clearRect(0,0,W,H);

    const drops=[...Array(7)].map((_,i)=>{const a=seed*3+i*0.9;return[cx+Math.cos(a)*Rr*(1.35+i%3*0.15),cy+Math.sin(a)*Rr*(1.3+i%2*0.2),Rr*(0.08+(i%3)*0.04)]});
    wx.fillStyle='rgba(20,33,91,.25)';path(Rr*1.04,cx,cy+Rr*0.05);wx.fill();

    wx.fillStyle=grd;path(Rr,cx,cy);wx.fill();drops.forEach(([x,y,r])=>{wx.beginPath();wx.arc(x,y,r,0,7);wx.fill()});
    wx.fillStyle='rgba(255,255,255,.6)';wx.beginPath();wx.ellipse(cx-Rr*0.35,cy-Rr*0.38,Rr*0.24,Rr*0.1,-0.6,0,7);wx.fill();

}

  drag.clone.style.left=(x-drag.w/2)+'px';drag.clone.style.top=(y-drag.h/2)+'px';
  const z=document.elementFromPoint(x,y)?.closest('.zone');
  if(z!==drag.hot){drag.hot?.classList.remove('hot');z?.classList.add('hot');drag.hot=z}
  if(game.L.tetris&&z){const a=anchor(z,x,y,drag.it),ok=fits(game.occ[a.z],a.c0,a.r0,drag.it.w,drag.it.h);
    Object.assign(preview.style,{left:a.c0/a.c*100+'%',top:a.r0/a.r*100+'%',width:drag.it.w/a.c*100+'%',height:drag.it.h/a.r*100+'%'});
    preview.className='preview'+(ok?'':' bad');z.querySelector('.grid').appendChild(preview)}else preview.remove();
}
function onMove(e){if(drag)moveTo(e.clientX,e.clientY)}
function cancelDrag(){if(!drag)return;removeEventListener('pointermove',onMove);removeEventListener('pointerup',onUp);removeEventListener('pointercancel',onUp);
  drag.clone.remove();drag.hot?.classList.remove('hot');drag.it.el.classList.remove('ghost');drag.it.where=drag.from;preview.remove();drag=null}
function onUp(e){
  removeEventListener('pointermove',onMove);removeEventListener('pointerup',onUp);removeEventListener('pointercancel',onUp);
  if(!drag)return;
  const{it,clone,hot,from}=drag;drag=null;clone.remove();hot?.classList.remove('hot');it.el.classList.remove('ghost');preview.remove();
  if(it.where!=='drag')return;it.where=from;
  if(!hot||!game||game.state!=='play')return;
  const zc=game.S.zones.find(z=>z.id===hot.dataset.z);
  if(!zc.accept.includes(it.t)){
    game.combo=0;game.mistakes++;game.score=Math.max(0,game.score-50);
    hot.classList.remove('bad');void hot.offsetWidth;hot.classList.add('bad');
    const o=$('#open');o.classList.remove('shake');void o.offsetWidth;o.classList.add('shake');
    popup(e.clientX,e.clientY,'−50','neg');sfx('bad');updateHud();return;
  }
  const a=anchor(hot,e.clientX,e.clientY,it),g=game.occ[a.z];let c0=a.c0,r0=a.r0;
  if(!fits(g,c0,r0,it.w,it.h)){
    if(game.L.tetris){popup(e.clientX,e.clientY,'Kein Platz!','neg');sfx('bad');hot.classList.remove('bad');void hot.offsetWidth;hot.classList.add('bad');return}
    let found=null;for(let r=0;r<a.r&&!found;r++)for(let c=0;c<a.c&&!found;c++)if(fits(g,c,r,it.w,it.h))found=[c,r];
    if(!found){popup(e.clientX,e.clientY,'Voll!','neg');return}[c0,r0]=found;
  }
  mark(g,c0,r0,it.w,it.h,1);
  const el=it.el,cw=a.gr.width/a.c,ch=a.gr.height/a.r;
  el.className='item placed'+(game.L.tetris?' shape':'');el.style.rotate='';el.style.transform='';el.style.animationDelay='0s';
  Object.assign(el.style,{left:c0/a.c*100+'%',top:r0/a.r*100+'%',width:it.w/a.c*100+'%',height:it.h/a.r*100+'%',fontSize:Math.min(cw*it.w,ch*it.h)*0.7+'px'});
  hot.querySelector('.grid').appendChild(el);it.where='placed';
  game.combo++;const pts=100+Math.min(game.combo-1,5)*20;game.score+=pts;game.placed++;
  popup(e.clientX,e.clientY,'+'+pts);burst(e.clientX,e.clientY,10+Math.min(game.combo,8));sfx('pop',game.combo);
  if(PRAISE[game.combo])flash(PRAISE[game.combo]);
  updateHud();checkDone();
}
function checkDone(){if(game&&game.state==='play'&&game.placed+game.lost>=game.total)finishPlay('complete')}
function finishPlay(kind){
  if(game.state!=='play')return;
  cancelAnimationFrame(game.raf);game.state='done';updateTimer();cancelDrag();
  game.thieves.forEach(th=>th.el.remove());game.thieves=[];
  let head;
  if(kind==='complete'){
    const tb=Math.ceil(game.timeLeft)*15;game.score+=tb;game.rows.push(['Zeitbonus','+'+fmt(tb)]);
    if(game.mistakes===0&&game.lost===0){game.score+=300;game.rows.push(['Perfekt sortiert','+300'])}
    head=game.lost?'Geschafft!':'Alles eingeräumt!';flash('Geschafft!');sfx('win');confetti();
  }else{head='Zeit um!';flash('Zeit um!');sfx('bad')}
  updateHud();
  const b=document.createElement('div');b.className='banner panel';b.id='banner';
  b.innerHTML=`<div class="foldicon" style="transform:scaleX(-1)"><i></i><i></i></div><p><strong class="ol">${head}</strong>${FOLD_SIM?'Tippe auf Zuklappen':'Handy zuklappen'} für die Punkte</p>`;
  document.body.appendChild(b);
}
function endGame(){
  if(!game)return;
  cancelAnimationFrame(game.raf);$('#banner')?.remove();cancelDrag();
  game.thieves.forEach(th=>th.el.remove());$('#open .tut')?.remove();
  const lv=game.lv,wasIntro=game.state==='intro';let res=null;
  if(!wasIntro){
    const left=game.items.filter(it=>it.where!=='placed'&&it.where!=='lost').length;
    const rows=[['Eingeräumt',`${game.placed} / ${game.total}`]];
    if(game.mistakes)rows.push(['Falsches Fach',`${game.mistakes} × −50`]);
    if(game.shoo)rows.push(['Mäuse verjagt',`${game.shoo} × +25`]);
    Object.entries(game.lostBy).forEach(([k,v])=>rows.push([k,`${v}×`]));
    rows.push(...game.rows);
    if(left){const pen=left*30;game.score=Math.max(0,game.score-pen);rows.push(['Liegen geblieben','−'+fmt(pen)])}
    const stars=starsFor(game,game.score),old=LV[lv]||{best:0,stars:0},rec=game.score>old.best;
    LV[lv]={best:Math.max(old.best,Math.round(game.score)),stars:Math.max(old.stars,stars)};store.set('kk4-levels',LV);
    if(stars>0&&lv+1<LEVELS.length&&!(old.stars>0))rows.push(['Freigeschaltet','Level '+(lv+2)]);
    res=['Level '+(lv+1),game.score,stars,rec&&old.best>0,rows];
  }
  game=null;view='closed';$('#open').hidden=true;$('#closed').hidden=false;
  resize3d();renderHud();
  if(res)setTimeout(()=>showResult(...res),FOLD_SIM&&!reduce?450:0);
}
})();
</script>
